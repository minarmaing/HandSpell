[project]
name = "handspell"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Afonso Silva"}
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]

[project.scripts]
handspell = "handspell:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
]
